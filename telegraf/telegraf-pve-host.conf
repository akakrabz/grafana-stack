# Telegraf on the PROXMOX HOST (Dell R710).
# Collects what PVE's built-in metric server does not: IPMI (iDRAC6) temps/fans/
# power, lm-sensors, SMART disk health, host disk I/O, and GPU stats.
# Installed by telegraf/install-pve-host.sh ; env comes from /etc/default/telegraf

[global_tags]
  role = "pve-host"
  model = "R710"

[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "30s"
  hostname = ""            # empty = use system hostname (matches PVE node name)
  omit_hostname = false

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
  timeout = "5s"

# ---------- OS-level (complements PVE's cpustat/memory) ----------
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  report_active = true
[[inputs.mem]]
[[inputs.swap]]
[[inputs.system]]
[[inputs.kernel]]
[[inputs.processes]]
[[inputs.net]]
  ignore_protocol_stats = true
[[inputs.diskio]]
  devices = ["sd*", "nvme*", "dm-*"]
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "overlay", "squashfs", "fuse.lxcfs"]

# ---------- Temperatures (coretemp, etc.) ----------
[[inputs.temp]]
[[inputs.sensors]]
  remove_numbers = true
  timeout = "5s"

# ---------- Dell iDRAC6 via local IPMI (ipmitool, /dev/ipmi0) ----------
# R710 exposes: Ambient/Inlet temp, fan RPM (FAN1..6), PSU input power (System Level),
# voltages, and PSU/intrusion status.
[[inputs.ipmi_sensor]]
  use_sudo = true
  interval = "60s"
  timeout = "20s"
  metric_version = 2
  hex_key = false
  # local BMC; add "lanplus" entries here to poll other servers' iDRACs remotely

# ---------- SMART (PERC H700 passthrough works with -d megaraid,N; see install script) ----------
[[inputs.smart]]
  use_sudo = true
  attributes = true
  interval = "5m"
  timeout = "60s"
  # uncomment + adjust if disks sit behind the PERC controller:
  # devices = ["/dev/sda -d megaraid,0", "/dev/sda -d megaraid,1"]

# ---------- GPU ----------
# NVIDIA: needs the proprietary driver + nvidia-smi on the host.
[[inputs.nvidia_smi]]
  bin_path = "/usr/bin/nvidia-smi"
  timeout = "10s"

# AMD alternative (needs rocm-smi installed). Uncomment and remove nvidia_smi if applicable.
# [[inputs.amd_rocm_smi]]
#   bin_path = "/opt/rocm/bin/rocm-smi"
#   timeout = "5s"
