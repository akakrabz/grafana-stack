# IPMI / BMC sensors (iDRAC, iLO, generic BMC) via local ipmitool + /dev/ipmi0.
# Enabled by install.sh only if `ipmitool sensor` returns data.
[[inputs.ipmi_sensor]]
  use_sudo = true
  interval = "60s"
  timeout = "20s"
  metric_version = 2
  hex_key = false
  # For a BMC that only works over the network (broken local interface), poll it
  # remotely instead - uncomment and fill in:
  # servers = ["USER:PASS@lanplus(BMC_IP)"]
