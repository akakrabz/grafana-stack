# SMART via smartctl. Enabled if `smartctl --scan` finds at least one device.
# Disks behind a hardware RAID controller (PERC/MegaRAID) need explicit devices, e.g.:
#   devices = ["/dev/sda -d megaraid,0", "/dev/sda -d megaraid,1"]
[[inputs.smart]]
  use_sudo = true
  attributes = true
  interval = "5m"
  timeout = "60s"
