# Telegraf on the HYPERVISOR HOST - base config (always installed).
# Optional hardware modules live in optional/*.conf and are enabled by install.sh
# only when the underlying tool actually works on this host.
# Env (INFLUX_*) comes from /etc/default/telegraf, written by install.sh.

[global_tags]
  role = "pve-host"

[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "30s"
  hostname = ""            # system hostname = PVE node name
  omit_hostname = false

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
  timeout = "5s"

# ---- OS-level, works everywhere ----
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  report_active = true
[[inputs.mem]]
[[inputs.swap]]
[[inputs.system]]
[[inputs.kernel]]
[[inputs.processes]]
[[inputs.net]]
  ignore_protocol_stats = true
[[inputs.diskio]]
  devices = ["sd*", "nvme*", "vd*", "dm-*", "md*"]
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "overlay", "squashfs", "fuse.lxcfs"]
# /sys/class/thermal - present on most x86 hosts, harmless if empty
[[inputs.temp]]
